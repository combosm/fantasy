[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-basketball-projections"
version = "0.1.0"
description = "Auditable NBA season projection and ESPN points ranking pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "requests>=2.32",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "XlsxWriter>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
fantasy = "fantasy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

